<!DOCTYPE html>
<html>
<head>
<title>Student Registration Form</title>
</head>

<body style="background-color:pink ; text-align:center;">
<h1 style="color:black;margin: 20px; border:2px solid black"> Student Registration Form </h1>

<form>
<label style="color:blue; padding:8px;text-align:left;">Full Name:</label><br>
<input type="text" id="name"><br><br>

<label style="color:blue; padding:8px;text-align:left;">Email:</label><br>
<input type="text" id="email"><br><br>

<label style="color:blue; padding:8px;text-align:left;">Password:</label><br>
<input type="text" id="password"><br><br>

<label style="color:blue; padding:8px;">Phone number:</label><br>
<input type="text" id="phone"><br><br>

<input type="submit"value="Register"style="color:white;background-color:green;">
<input type="reset" value="Reset"style="color:white;background-color:red;">
</form>
</body>
</html>
