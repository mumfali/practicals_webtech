<!DOCTYPE html>
<html>
<head>
    <title>SHOES SHOPPING CART</title>

    <style>
        body {
            font-family: Arial;
            background: #f2f2f2;
            text-align: center;
        }

        .cart {
            background: white;
            width: 600px;
            margin: 30px auto;
            padding: 20px;
            border-radius: 10px;
        }

        input, button {
            padding: 8px;
            margin: 5px;
        }

        button {
            background: purple;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        table {
            width: 100%;
            margin-top: 20px;
            border-collapse: collapse;
        }

        th, td {
            padding: 8px;
            border: 1px solid #ccc;
        }

        th {
            background: purple;
            color: white;
        }

        h1 {
            color: red;
        }
    </style>
</head>

<body>

    <div class="cart">

        <h1>SHOES SHOPPING CART</h1>

        <input id="name" placeholder="Shoe Name">
        <input id="price" type="number" placeholder="Price">
        <input id="qty" type="number" placeholder="Quantity">

        <button onclick="addShoe()">Add Shoe</button>

        <br>

        <input id="removeId" type="number" placeholder="Shoe ID">
        <button onclick="removeShoe()">Remove Shoe</button>

        <table>
            <tr>
                <th>ID</th>
                <th>Shoe</th>
                <th>Price</th>
                <th>Qty</th>
            </tr>

            <tbody id="cart"></tbody>
        </table>

        <h3>
            Shoe Names:
            <span id="names"></span>
        </h3>

        <h2>
            Total: ₹<span id="total">0</span>
        </h2>

    </div>

    <script src="script.js"></script>

</body>
</html>
