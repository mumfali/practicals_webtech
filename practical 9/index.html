<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Daily To-Do List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="app">
        <h1>My Daily To-Do List</h1>
        <p class="subtitle">Organize your tasks and track your progress.</p>

        <form id="task-form">
            <input id="task-input" type="text"
                   placeholder="Enter a task..." required>
            <button type="submit">Add Task</button>
        </form>

        <p id="task-count">0 tasks remaining</p>
        <ul id="task-list"></ul>
    </main>

    <script src="script.js"></script>
</body>
</html>
